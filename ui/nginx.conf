server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Route requests under /ui
    location /ui/ {
        try_files $uri $uri.html $uri/ /ui/404.html =404;
    }

    # Redirect root to /ui/
    location = / {
        return 301 /ui/;
    }

    # Static assets cache for Next.js immutable assets
    location /ui/_next/static/ {
        alias /usr/share/nginx/html/ui/_next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Disable cache for HTML files to force revalidation
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
