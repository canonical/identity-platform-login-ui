name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-**"
    tags:
      - "v**"
  pull_request:
    branches:
      - "*"


jobs:
  openspec-check:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/openspec-check.yaml
  unit-test:
    uses: ./.github/workflows/unittest.yaml
  e2e-test:
    uses: ./.github/workflows/e2etest.yaml

  get-architectures:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.parse.outputs.architectures }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse platforms from rockcraft.yaml
        id: parse
        run: |
          archs=$(yq -o=json -I=0 '.platforms | keys' rockcraft.yaml)
          echo "Found architectures: $archs"
          echo "architectures=$archs" >> "$GITHUB_OUTPUT"

  build:
    needs: [ unit-test, get-architectures ]
    strategy:
      matrix:
        architecture: ${{ fromJson(needs.get-architectures.outputs.architectures) }}
    uses: canonical/identity-team/.github/workflows/_rock-build.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      structure-tests-enabled: true
      architecture: ${{ matrix.architecture }}

  gh-publish-branch:
    permissions:
      packages: write
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [ build, unit-test ]
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0

  gh-publish-candidate:
    permissions:
      packages: write
      contents: read
    if: ${{ github.ref_type == 'tag' }}
    needs: [ build, unit-test ]
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      candidate: true

  scan:
    permissions:
      packages: read
      contents: read
      security-events: write
      actions: read
    if: ${{ !cancelled() && (needs.gh-publish-branch.result == 'success' || needs.gh-publish-candidate.result == 'success') }}
    needs: [ gh-publish-branch, gh-publish-candidate ]
    uses: canonical/identity-team/.github/workflows/_rock-scan.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      image: ${{ needs.gh-publish-candidate.outputs.image || needs.gh-publish-branch.outputs.image }}
      exit-code: '1'
      severity: 'HIGH,CRITICAL'
      ignore-unfixed: true
      trivyignores: '.trivyignore'

  promote:
    permissions:
      packages: write
      contents: write
    if: ${{ github.ref_type == 'tag' }}
    needs: [ gh-publish-candidate, scan ]
    uses: canonical/identity-team/.github/workflows/_rock-promote.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      candidate-image: ${{ needs.gh-publish-candidate.outputs.image }}
      release-tag: ${{ github.ref_name }}
      promote-stable: true

  oci-publish:
    # only release to oci-factory in case of release
    if: github.ref_type == 'tag'
    needs: [ promote ]
    uses: canonical/identity-team/.github/workflows/_rock-oci-publish.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      eol-stable-release: "6 month"
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  oci-update-pr:
    needs: [ promote ]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      pull-requests: write
    uses: canonical/identity-team/.github/workflows/oci-update-pr.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
        oci-image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        repository: canonical/identity-platform-login-ui-operator
    secrets:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
